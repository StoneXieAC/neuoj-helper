name: CLion 插件跨平台测试

on:
  push:
    branches: [main, feat/clion-integration]
    paths:
      - 'clion-plugin/**'
      - '.github/workflows/clion-plugin-test.yml'
  pull_request:
    paths:
      - 'clion-plugin/**'
      - '.github/workflows/clion-plugin-test.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: 测试并构建插件
        shell: bash
        working-directory: clion-plugin
        run: ./gradlew test buildPlugin
