name: CLion 插件跨平台测试

on:
  push:
    branches: [main, feat/clion-integration]
    paths:
      - 'clion-plugin/**'
      - '.github/workflows/clion-plugin-test.yml'
  pull_request:
    paths:
      - 'clion-plugin/**'
      - '.github/workflows/clion-plugin-test.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: 检查 macOS 计时程序架构
        if: runner.os == 'macOS'
        run: |
          clang -fsyntax-only -Wall -Wextra -Werror clion-plugin/native/macos/neuoj-time.c
          archs="$(lipo -archs clion-plugin/src/main/resources/native/macos/neuoj-time)"
          case " $archs " in *" arm64 "*) ;; *) exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) exit 1 ;; esac
      - name: 检查 Linux 和 Windows 原生计时程序可重建
        if: runner.os == 'Linux'
        run: |
          curl -fL --retry 3 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  '"$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          export ZIG="$RUNNER_TEMP/zig-x86_64-linux-0.14.1/zig"
          sh clion-plugin/native/linux/build.sh
          sh clion-plugin/native/windows/build.sh
          git diff --exit-code -- clion-plugin/src/main/resources/native/linux-x64 clion-plugin/src/main/resources/native/windows-x64
      - name: 测试并构建插件
        shell: bash
        working-directory: clion-plugin
        run: ./gradlew test buildPlugin
      - name: 检查插件包包含三个平台的计时程序
        shell: bash
        working-directory: clion-plugin
        run: |
          plugin_jar="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-base.jar' ! -name '*-searchableOptions.jar' -print -quit)"
          test -n "$plugin_jar"
          jar tf "$plugin_jar" | grep -Fx native/macos/neuoj-time
          jar tf "$plugin_jar" | grep -Fx native/linux-x64/neuoj-time
          jar tf "$plugin_jar" | grep -Fx native/windows-x64/neuoj-time.exe
