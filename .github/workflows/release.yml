name: 测试与发布

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 检查版本标签
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p = require('./package.json').version; const m = require('./extension/manifest.json').version; if (p !== m || process.env.GITHUB_REF_NAME !== 'v' + m) throw new Error('标签与项目版本不一致');"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox
      - name: 保存构建目录
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: |
            dist/chrome
            dist/firefox
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-builds
          path: dist
      - name: 打包 Chrome
        run: node scripts/release.js package
      - name: Mozilla 签名与核验
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: node scripts/release.js sign
      - name: 保存已核验发行包
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-packages
          path: |
            dist/releases/*.zip
            dist/releases/*.xpi
          if-no-files-found: error
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          chrome="dist/releases/neuoj-helper-${version}-chrome.zip"
          firefox="dist/releases/neuoj-helper-${version}-firefox.xpi"
          test -f "$chrome"
          test -f "$firefox"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$chrome" "$firefox" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$chrome" "$firefox" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
