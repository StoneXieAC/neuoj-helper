name: 测试与发布

on:
  push:
    branches: [main, feat/clion-integration]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: 检查版本标签
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const fs = require('node:fs'); const p = require('./package.json').version; const l = require('./package-lock.json').version; const m = require('./extension/manifest.json'); const g = fs.readFileSync('clion-plugin/build.gradle.kts', 'utf8').match(/^version = \"([^\"]+)\"$/m)?.[1]; if (p !== l || p !== m.version_name || p !== g || m.version !== p.replace(/-.+$/, '') || process.env.GITHUB_REF_NAME !== 'v' + p) throw new Error('标签与项目版本不一致');"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox
      - name: 保存构建目录
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: browser-builds
          path: |
            dist/chrome
            dist/firefox
          if-no-files-found: error

  clion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: 测试并构建 CLion 插件
        working-directory: clion-plugin
        run: ./gradlew test buildPlugin
      - name: 保存 CLion 插件包
        uses: actions/upload-artifact@v7
        with:
          name: clion-plugin
          path: clion-plugin/build/distributions/neuoj-clion-helper-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, clion]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: browser-builds
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: clion-plugin
          path: dist/releases
      - name: 打包 Chrome
        run: node scripts/release.js package
      - name: Mozilla 签名与核验
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: node scripts/release.js sign
      - name: 保存已核验发行包
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-packages
          path: |
            dist/releases/*.zip
            dist/releases/*.xpi
          if-no-files-found: error
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          chrome="dist/releases/neuoj-helper-${version}-chrome.zip"
          firefox="dist/releases/neuoj-helper-${version}-firefox.xpi"
          clion="dist/releases/neuoj-clion-helper-${version}.zip"
          test -f "$chrome"
          test -f "$firefox"
          test -f "$clion"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$chrome" "$firefox" "$clion" --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease
            fi
          else
            release_flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "$chrome" "$firefox" "$clion" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
          fi
